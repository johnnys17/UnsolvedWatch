[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Static state pages live at /site/states/{abbr}/index.html — no redirects needed.
# Netlify automatically serves index.html for directory requests.

# Pretty URLs without trailing slash: /states/fl → /states/fl/
[[redirects]]
  from = "/states/:abbr"
  to = "/states/:abbr/"
  status = 301
